apiVersion: apps/v1
kind: Deployment

metadata:
  name: argocd-demo

spec:
  replicas: 2

  selector:
    matchLabels:
      app: argocd-demo

  template:
    metadata:
      labels:
        app: argocd-demo

    spec:
      containers:
        - name: argocd-demo
          image: arulchinnappa12112004/argocd-demo:v1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000